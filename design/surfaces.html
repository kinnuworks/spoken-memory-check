<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge-facing images</title>
<!--
  Gallery thumbnail, README hero, GitHub social preview and Open Graph image,
  drawn with the app's own tokens so they look like the same product.

  1. Copy this file to design/surfaces.html in the project.
  2. Point the three stylesheet links at the files the app loads, and paste
     the design's font <link> tags where marked.
  3. Replace NAME, TAGLINE and the screenshot path. The words come from the
     design brief; the screenshot is the real product at its result state,
     cropped to the product window:
     node shoot.mjs shot "<url>?state=result" design/shots/result-1440.png --selector "<product window>"
     The screenshot already carries the product's own window chrome, so the
     stage below adds none. If your screenshot is a bare app with no window,
     add class "framed" to each .s-stage to give it the design's window frame.
  4. Optional: set --surface-bg to a generated background image.
  5. Render with the screenshot script:
     node <path to shoot.mjs> surfaces design/surfaces.html design/out
-->
<style>
  @font-face { font-family: "Cal Sans"; src: url(../node_modules/@fontsource/cal-sans/files/cal-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Sans Variable"; src: url(../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2) format("woff2-variations"); font-weight: 400 700; }
</style>
<link rel="stylesheet" href="../src/styles/design/base.css">
<link rel="stylesheet" href="../src/styles/design/components.css">
<link rel="stylesheet" href="../src/styles/design/theme.css">
<style>
  body { padding: 40px; background: #777; display: grid; gap: 40px; justify-content: start; }
  [data-surface] {
    position: relative; overflow: hidden; isolation: isolate;
    background-color: var(--paper);
    background-image: var(--surface-bg, var(--bg-pattern));
    background-size: var(--surface-bg-size, var(--bg-size));
    background-position: center;
    color: var(--ink);
  }
  .s-name {
    font-family: var(--font-display); font-weight: var(--weight-display);
    letter-spacing: var(--track-display); text-transform: var(--display-case);
    line-height: 0.95; color: var(--ink); margin: 0;
  }
  .s-tag { font-family: var(--font-ui); color: var(--ink-2); line-height: 1.2; margin: 0; max-width: 18ch; }
  .s-shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; border-radius: 14px; box-shadow: var(--shadow-3); }
  .s-stage { position: absolute; overflow: visible; }
  [data-surface] { background: #ffffff url(../public/images/cal-window.webp) center / cover; }
  [data-surface]::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(255, 255, 255, .78); }
  .s-stage.framed { background: var(--sheet); border: var(--border-w) solid var(--frame-line); border-radius: var(--r-window); box-shadow: var(--shadow-window); }

  /* Gallery thumbnail, 3:2. Name stays readable at 320 px wide. */
  .thumb { width: 1500px; height: 1000px; }
  .thumb .s-copy { position: absolute; left: 72px; top: 60px; right: 72px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .thumb .s-name { font-size: 96px; letter-spacing: -.035em; max-width: 9ch; }
  .thumb .s-tag { font-size: 40px; text-align: right; color: #374151; }
  .thumb .s-stage { left: 72px; right: 72px; top: 330px; bottom: 56px; }

  /* README hero and social previews, 2:1. Words left, product right. */
  .wide .s-copy { position: absolute; display: grid; gap: 28px; align-content: center; }
  .wide .s-stage { top: 12%; bottom: -8%; }
  .wide .s-shot { object-fit: contain; object-position: left center; box-shadow: none; }
  .wide .s-stage { top: 0 !important; bottom: 0 !important; display: grid; align-items: center; }
  .wide .s-stage .s-shot { height: auto; filter: drop-shadow(0 24px 40px rgba(16, 31, 50, .28)); }
  .hero { width: 1600px; height: 800px; }
  .hero .s-copy { left: 80px; top: 0; bottom: 0; width: 520px; }
  .hero .s-name { font-size: 88px; letter-spacing: -.035em; }
  .hero .s-tag { font-size: 40px; }
  .hero .s-stage { left: 640px; right: 48px; }
  .social { width: 1280px; height: 640px; }
  .social .s-copy { left: 64px; top: 0; bottom: 0; width: 440px; }
  .social .s-name { font-size: 72px; letter-spacing: -.035em; }
  .social .s-tag { font-size: 34px; }
  .social .s-stage { left: 520px; right: 40px; }
  .og { width: 1200px; height: 630px; }
  .og .s-copy { left: 60px; top: 0; bottom: 0; width: 410px; }
  .og .s-name { font-size: 68px; letter-spacing: -.035em; }
  .og .s-tag { font-size: 32px; }
  .og .s-stage { left: 480px; right: 36px; }
</style>
</head>
<body>

<section data-surface="thumbnail" class="thumb">
  <div class="s-copy">
    <h1 class="s-name">Spoken memory check</h1>
    <p class="s-tag">A memory check you speak.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="The rule run on a synthetic person: a year of checks against their own baseline, the steps it took, and a packet sent to the physician"></div>
</section>

<section data-surface="readme-hero" class="wide hero">
  <div class="s-copy">
    <h1 class="s-name">Spoken memory check</h1>
    <p class="s-tag">A memory check you speak.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="The rule run on a synthetic person: a year of checks against their own baseline, the steps it took, and a packet sent to the physician"></div>
</section>

<section data-surface="social-github" class="wide social">
  <div class="s-copy">
    <h1 class="s-name">Spoken memory check</h1>
    <p class="s-tag">A memory check you speak.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="The rule run on a synthetic person: a year of checks against their own baseline, the steps it took, and a packet sent to the physician"></div>
</section>

<section data-surface="social-og" class="wide og">
  <div class="s-copy">
    <h1 class="s-name">Spoken memory check</h1>
    <p class="s-tag">A memory check you speak.</p>
  </div>
  <div class="s-stage"><img class="s-shot" src="shots/result-1440.png" alt="The rule run on a synthetic person: a year of checks against their own baseline, the steps it took, and a packet sent to the physician"></div>
</section>

</body>
</html>
