name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Rule's nine safety promises on 1,000,000 random histories
        run: npx tsx scripts/safety-check.ts 1000000
        env:
          SAFETY_NO_WRITE: '1'
      - run: npm run build
